name: Bootstrap CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-odin:
    name: Linux pinned Odin build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install exact Odin release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/odin.tar.gz"
          root="$RUNNER_TEMP/odin"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-linux-amd64-dev-2026-10.tar.gz
          echo "c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab  $archive" | sha256sum --check -
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root" --strip-components=1
          "$root/odin" version
          echo "$root" >> "$GITHUB_PATH"

      - name: Validate pinned manifest
        run: python3 -m json.tool bench/manifests/baselines.json > /dev/null

      - name: Run source reference tests
        run: odin test src/source

      - name: Run compatibility profile tests
        run: odin test src/compat

      - name: Validate pinned oracle configuration
        run: node tools/oracle/profile.test.mjs

      - name: Run scanner subset tests
        run: odin test src/scanner

      - name: Validate parser-side lexical context
        run: odin test src/context

      - name: Build bootstrap CLI
        shell: bash
        run: |
          set -euo pipefail
          odin build src/cli -out:"$RUNNER_TEMP/tsodin"
          test "$("$RUNNER_TEMP/tsodin" --version)" = "tsodin 0.0.0-dev"
          set +e
          "$RUNNER_TEMP/tsodin" check
          status=$?
          set -e
          test "$status" -eq 2
