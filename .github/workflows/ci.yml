name: Bootstrap CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-odin:
    name: Linux pinned Odin build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install exact Odin release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/odin.tar.gz"
          root="$RUNNER_TEMP/odin"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-linux-amd64-dev-2026-10.tar.gz
          echo "c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab  $archive" | sha256sum --check -
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root" --strip-components=1
          "$root/odin" version
          echo "$root" >> "$GITHUB_PATH"

      - name: Validate pinned manifest
        run: python3 -m json.tool bench/manifests/baselines.json > /dev/null

      - name: Run source reference tests
        run: odin test src/source

      - name: Run compatibility profile tests
        run: odin test src/compat

      - name: Validate pinned oracle configuration
        run: node tools/oracle/profile.test.mjs

      - name: Run scanner subset tests
        run: odin test src/scanner

      - name: Validate parser-side lexical context
        run: odin test src/context

      - name: Validate expression precedence and syntax recovery
        run: odin test src/parser

      - name: Validate single-file binder and symbol references
        run: odin test src/binder

      - name: Validate primitive semantic checker
        run: odin test src/checker

      - name: Validate checker probe driver and sampler
        shell: bash
        run: |
          set -euo pipefail
          node tools/perf/compare-checker.mjs --self-test
          odin build src/checkbench -o:speed -out:"$RUNNER_TEMP/checkbench"
          "$RUNNER_TEMP/checkbench" tests/oracle/checker-flow-mixed-nested-valid/index.ts | grep -E 'RESULT[[:space:]]+8192[[:space:]]+0[[:space:]]+[0-9]+'

      - name: Run source-to-type-diagnostics smoke
        shell: bash
        run: |
          set -euo pipefail
          odin build src/checktrace -out:"$RUNNER_TEMP/checktrace"
          TSODIN_CHECKTRACE="$RUNNER_TEMP/checktrace" node tools/oracle/check-primitive-trace.mjs

      - name: Verify structured stage dump and UTF-16 spans
        shell: bash
        run: |
          set -euo pipefail
          odin build src/cli -out:"$RUNNER_TEMP/tsodin-dump"
          TSODIN_BIN="$RUNNER_TEMP/tsodin-dump" node tools/dump/check.mjs
          TSODIN_BIN="$RUNNER_TEMP/tsodin-dump" node tools/dump/build-gallery.mjs --check
          node --check lib/stage-lab.mjs
          node tools/dump/check-gallery.mjs

      - name: Validate developer syntax diagnostic trace
        shell: bash
        run: |
          set -euo pipefail
          odin build src/syntaxtrace -out:"$RUNNER_TEMP/syntaxtrace"
          TSODIN_SYNTAXTRACE="$RUNNER_TEMP/syntaxtrace" node tools/oracle/check-syntaxtrace.mjs

      - name: Build bootstrap CLI
        shell: bash
        run: |
          set -euo pipefail
          odin build src/cli -out:"$RUNNER_TEMP/tsodin"
          test "$("$RUNNER_TEMP/tsodin" --version)" = "tsodin 0.0.0-dev"
          set +e
          "$RUNNER_TEMP/tsodin" check
          status=$?
          set -e
          test "$status" -eq 2
