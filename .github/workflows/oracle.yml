name: Pinned TypeScript oracle capture

on:
  pull_request:
    paths:
      - ".github/workflows/oracle.yml"
      - "tools/oracle/**"
      - "tests/oracle/**"
      - "src/scanner/**"
      - "src/scantrace/**"
      - "src/source/**"
      - "src/compat/**"
      - "src/context/**"
      - "src/parser/**"
      - "src/binder/**"
      - "src/checker/**"
      - "src/checkbench/**"
      - "src/dump/**"
      - "tools/dump/**"
      - "src/checktrace/**"
      - "src/syntaxtrace/**"
      - "src/contexttrace/**"
      - "tests/lexical/**"
      - "bench/manifests/baselines.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    name: Pinned TypeScript CLI capture / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # When another TypeScript version is approved, add its registered ID
      # here; the capture script and compiler architecture remain unchanged.
      matrix:
        profile: [ts7]
    steps:
      - uses: actions/checkout@v7
      - name: Validate profile registry
        run: |
          node tools/oracle/profile.test.mjs
          node tools/oracle/upstream-triage.test.mjs
      - name: Install exact reference compiler for profile
        shell: bash
        env:
          TSODIN_ORACLE_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          spec="$(node tools/oracle/profile.mjs npmSpec "$TSODIN_ORACLE_PROFILE")"
          executable="$(node tools/oracle/profile.mjs executable "$TSODIN_ORACLE_PROFILE")"
          npm install --prefix "$RUNNER_TEMP/ts-oracle" --no-save --no-audit --no-fund "$spec"
          binary="$RUNNER_TEMP/ts-oracle/node_modules/.bin/$executable"
          "$binary" --version
          echo "TSODIN_TSC=$binary" >> "$GITHUB_ENV"
      - name: Capture raw CLI diagnostics
        env:
          TSODIN_ORACLE_PROFILE: ${{ matrix.profile }}
          TSODIN_ORACLE_OUTPUT: ${{ runner.temp }}/oracle-results
        run: node tools/oracle/capture.mjs
      - name: Capture unary literal-inference evidence
        run: node tools/oracle/check-unary-inference.mjs
      - name: Probe logical Boolean inference against TS7
        run: node tools/oracle/check-logical-inference.mjs
      - name: Upload scoped oracle evidence
        uses: actions/upload-artifact@v6
        with:
          name: oracle-${{ matrix.profile }}-raw
          path: ${{ runner.temp }}/oracle-results/
          retention-days: 14

  lexical-witness:
    name: Auxiliary TS6 lexical witness (not TS7 parity)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install exact Odin toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/odin.tar.gz"
          root="$RUNNER_TEMP/odin"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-linux-amd64-dev-2026-10.tar.gz
          echo "c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab  $archive" | sha256sum --check -
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root" --strip-components=1
          "$root/odin" version
          echo "$root" >> "$GITHUB_PATH"
      - name: Build Odin source-token tracer
        run: odin build src/scantrace -out:"$RUNNER_TEMP/scantrace"
      - name: Build contextual token tracer
        run: odin build src/contexttrace -out:"$RUNNER_TEMP/contexttrace"
      - name: Install pinned supplementary lexical API
        run: npm install --prefix "$RUNNER_TEMP/ts6-lex" --no-save --no-audit --no-fund @typescript/typescript6@6.0.2
      - name: Compare scanner token kinds and UTF-16 spans
        env:
          TSODIN_SCANTRACE: ${{ runner.temp }}/scantrace
          TSODIN_TS6_API: ${{ runner.temp }}/ts6-lex/node_modules/@typescript/typescript6/lib/typescript.js
        run: node tools/oracle/compare-scanner.mjs
      - name: Compare contextual rescans and UTF-16 spans
        env:
          TSODIN_CONTEXTTRACE: ${{ runner.temp }}/contexttrace
          TSODIN_TS6_API: ${{ runner.temp }}/ts6-lex/node_modules/@typescript/typescript6/lib/typescript.js
        run: node tools/oracle/compare-context.mjs


  primitive-code-witness:
    name: Primitive TS7 code + UTF-16 start witness (not full parity)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Odin toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/odin.tar.gz"
          root="$RUNNER_TEMP/odin"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-linux-amd64-dev-2026-10.tar.gz
          echo "c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab  $archive" | sha256sum --check -
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root" --strip-components=1
          echo "$root" >> "$GITHUB_PATH"
      - name: Install pinned TypeScript 7 CLI
        shell: bash
        run: |
          set -euo pipefail
          node tools/oracle/profile.test.mjs
          spec="$(node tools/oracle/profile.mjs npmSpec ts7)"
          npm install --prefix "$RUNNER_TEMP/ts7" --no-save --no-audit --no-fund "$spec"
          binary="$RUNNER_TEMP/ts7/node_modules/.bin/tsc"
          "$binary" --version
          echo "TSODIN_TSC=$binary" >> "$GITHUB_ENV"
      - name: Build actual Odin semantic checker trace
        shell: bash
        run: |
          set -euo pipefail
          odin build src/checktrace -out:"$RUNNER_TEMP/checktrace"
          echo "TSODIN_CHECKTRACE=$RUNNER_TEMP/checktrace" >> "$GITHUB_ENV"
      - name: Compare TypeScript 7 codes and UTF-16 starts on a tiny supported slice
        run: node tools/oracle/compare-primitive-codes.mjs
      - name: Install pinned supplemental TypeScript 6 structured API
        run: npm install --prefix "$RUNNER_TEMP/ts6-structured" --no-save --no-audit --no-fund @typescript/typescript6@6.0.2
      - name: Compare full error spans to supplementary TS6 structured diagnostics
        env:
          TSODIN_TS6_API: ${{ runner.temp }}/ts6-structured/node_modules/@typescript/typescript6/lib/typescript.js
        run: node tools/oracle/compare-primitive-structured.mjs
