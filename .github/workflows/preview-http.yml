name: Verify published Pages previews

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preview-http.yml"
      - "preview/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-preview-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify official Pages routes and assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://megaalive.github.io/tsodin"
          page="$RUNNER_TEMP/site.html"
          for entry in "preview/|Choose your" "preview/soft/|Soft Blue Glass Preview" "preview/neon/|Neon Odin Preview"; do
            path="${entry%%|*}"
            expected="${entry#*|}"
            echo "Checking ${base}/${path}"
            curl --fail --silent --show-error --location --retry 6 --retry-delay 2 --retry-all-errors --max-time 20 "${base}/${path}" -o "$page"
            grep -F "$expected" "$page" >/dev/null
            printf 'PASS: %s\n' "$path"
          done
          for path in "preview/soft.css" "preview/neon.css" "app.js" "styles.css" "preview/soft/data/observatory.json" "preview/neon/data/observatory.json"; do
            echo "Checking ${base}/${path}"
            curl --fail --silent --show-error --location --retry 6 --retry-delay 2 --retry-all-errors --max-time 20 "${base}/${path}" -o /dev/null
          done
          printf '%s\n' 'PASS: official published preview pages and their assets are HTTP-accessible'
